<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <label for="tag">Gamertag</label>
        <input type="text" id="tag" name="gamertag" required>

        <label for="mail">E-mailadres</label>
        <input type="email" id="mail" name="email" required>

        <label for="age">Leeftijd</label>
        <input type="number" min="12" id="age" name="age" required >

        <p>Welk platform?</p>
        <input type="radio" id="pc" name="platform" value="pc">
        <label for="pc">PC</label>
        <input type="radio" id="console" name="platform" value="console">
        <label for="console">Console</label>

        <label for="team">Team</label>
        <select name="team" id="team">
            <option>Team Rood</option>
            <option>Team Blauw</option>
        </select>

        <label for="motivatie">Waarom wil je mee doen?</label>
        <textarea name="motivatie" id="motivatie"></textarea>
        
        <button type="submit">Meld me aan</button>
    </form>
</body>
</html>
